# AI 비서 자동 체크인 — 매일 07:00, 21:00 KST
# 아침: 할일 요약 브리핑 / 저녁: 회고 리마인더
name: ai-assistant

on:
  schedule:
    - cron: '0 22 * * *'  # 07:00 KST (UTC 22) — 아침
    - cron: '0 12 * * *'  # 21:00 KST (UTC 12) — 저녁
  workflow_dispatch:
    inputs:
      mode:
        description: 'morning or evening'
        required: true
        default: 'morning'

jobs:
  morning:
    if: github.event.schedule == '0 22 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'morning')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Morning briefing
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          AI_ASSISTANT_DB_ID: ${{ secrets.AI_ASSISTANT_DB_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: morning
        run: node scripts/ai-assistant.js

  evening:
    if: github.event.schedule == '0 12 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'evening')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Evening check-in
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          AI_ASSISTANT_DB_ID: ${{ secrets.AI_ASSISTANT_DB_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: evening
        run: node scripts/ai-assistant.js
