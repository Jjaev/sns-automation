<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무료 SNS 계정 진단 | studio_sj</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a1a;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }
  .container { max-width: 640px; width: 100%; }
  header { text-align: center; margin-bottom: 2rem; }
  header h1 {
    font-size: 1.8rem;
    background: linear-gradient(135deg, #e94560, #0f3460);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.5rem;
  }
  header p { color: #8899aa; font-size: 0.95rem; line-height: 1.6; }
  .card {
    background: #12122a;
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 1rem;
    border: 1px solid #1a1a3e;
  }
  .card h2 { font-size: 1rem; color: #e94560; margin-bottom: 1rem; }
  label { display: block; font-size: 0.85rem; color: #aabbcc; margin-bottom: 0.4rem; }
  input, select, textarea {
    width: 100%;
    padding: 0.75rem 1rem;
    background: #1a1a3e;
    border: 1px solid #2a2a5e;
    border-radius: 10px;
    color: #fff;
    font-size: 1rem;
    margin-bottom: 1rem;
    transition: border-color 0.2s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: #e94560;
  }
  textarea { resize: vertical; min-height: 80px; }
  select option { background: #12122a; }
  .btn {
    width: 100%;
    padding: 1rem;
    background: linear-gradient(135deg, #e94560, #c23152);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  .btn:hover { opacity: 0.9; }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .result {
    display: none;
    margin-top: 1rem;
  }
  .result.visible { display: block; }
  .score-ring {
    width: 120px; height: 120px;
    border-radius: 50%;
    margin: 1rem auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    font-weight: 700;
    border: 6px solid;
  }
  .score-high { border-color: #22c55e; }
  .score-mid { border-color: #eab308; }
  .score-low { border-color: #e94560; }
  .loading {
    text-align: center; padding: 2rem;
    color: #8899aa;
  }
  .loading .spinner {
    width: 32px; height: 32px;
    border: 3px solid #1a1a3e;
    border-top-color: #e94560;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 1rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tag {
    display: inline-block;
    padding: 0.3rem 0.8rem;
    border-radius: 20px;
    font-size: 0.8rem;
    margin: 0.3rem;
  }
  .tag-good { background: #14532d; color: #4ade80; }
  .tag-bad { background: #450a0a; color: #f87171; }
  .tag-meh { background: #422006; color: #fbbf24; }
  .rec-item {
    padding: 0.75rem 0;
    border-bottom: 1px solid #1a1a3e;
    font-size: 0.9rem;
    line-height: 1.5;
  }
  .rec-item:last-child { border: none; }
  .rec-item strong { color: #e94560; }
  .cta-box {
    background: linear-gradient(135deg, #1a1a3e, #0f3460);
    border-radius: 12px;
    padding: 1.2rem;
    text-align: center;
    margin-top: 1rem;
  }
  .cta-box h3 { color: #fff; margin-bottom: 0.5rem; }
  .cta-box p { color: #8899aa; font-size: 0.85rem; }
  .btn-small {
    display: inline-block;
    padding: 0.6rem 1.5rem;
    background: #e94560;
    border-radius: 8px;
    color: #fff;
    text-decoration: none;
    font-size: 0.9rem;
    margin-top: 0.8rem;
  }
  .hidden { display: none; }
  footer {
    margin-top: 3rem;
    text-align: center;
    color: #445566;
    font-size: 0.8rem;
  }
  .step-indicator {
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    margin-bottom: 2rem;
  }
  .step {
    width: 32px; height: 4px;
    border-radius: 2px;
    background: #1a1a3e;
    transition: background 0.3s;
  }
  .step.active { background: #e94560; }
  .step.done { background: #22c55e; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🔍 무료 SNS 계정 진단</h1>
    <p>인스타그램 계정을 분석하고<br>맞춤 개선 전략을 무료로 제공합니다</p>
  </header>

  <!-- Step indicators -->
  <div class="step-indicator">
    <div class="step active" id="s1"></div>
    <div class="step" id="s2"></div>
    <div class="step" id="s3"></div>
  </div>

  <!-- Step 1: Basic info -->
  <div id="step1" class="card">
    <h2>📋 기본 정보</h2>
    <label>계정명 (@ 제외)</label>
    <input type="text" id="username" placeholder="example_account" autocomplete="off">
    
    <label>업종</label>
    <select id="industry">
      <option value="">선택하세요</option>
      <option>카페/디저트</option>
      <option>음식점/맛집</option>
      <option>뷰티/헤어/네일</option>
      <option>피트니스/요가</option>
      <option>교육/학원</option>
      <option>부동산/공인중개</option>
      <option>패션/쇼핑몰</option>
      <option>IT/스타트업</option>
      <option>디자인/사진</option>
      <option>1인 미디어/크리에이터</option>
      <option>기타</option>
    </select>

    <button class="btn" onclick="nextStep()">다음</button>
  </div>

  <!-- Step 2: Account metrics -->
  <div id="step2" class="card hidden">
    <h2>📊 계정 현황</h2>
    <label>현재 팔로워 수</label>
    <select id="followers">
      <option value="0">0~100명</option>
      <option value="1">100~500명</option>
      <option value="2">500~1,000명</option>
      <option value="3">1,000~5,000명</option>
      <option value="4">5,000~10,000명</option>
      <option value="5">10,000명 이상</option>
    </select>

    <label>주간 게시물 수</label>
    <select id="posting">
      <option value="0">거의 안 함 (주 0~1회)</option>
      <option value="1">가끔 (주 2~3회)</option>
      <option value="2">보통 (주 4~5회)</option>
      <option value="3">자주 (주 6~10회)</option>
      <option value="4">매일 (주 10회 이상)</option>
    </select>

    <label>SNS 운영에서 가장 어려운 점</label>
    <select id="painpoint">
      <option value="">선택하세요</option>
      <option>콘텐츠 아이디어 부족</option>
      <option>시간 부족</option>
      <option>팔로워 증가 안 됨</option>
      <option>좋아요/댓글 없음</option>
      <option>매출 연결 안 됨</option>
      <option>디자인/영상 제작</option>
      <option>해시태그 전략</option>
    </select>

    <div style="display:flex; gap:0.5rem; margin-top:0.5rem;">
      <button class="btn" style="flex:1; background:#1a1a3e;" onclick="prevStep()">이전</button>
      <button class="btn" style="flex:3;" onclick="runDiagnosis()">진단 받기</button>
    </div>
  </div>

  <!-- Loading -->
  <div id="loading" class="card hidden">
    <div class="loading">
      <div class="spinner"></div>
      <p>AI가 계정을 분석하고 있습니다...</p>
      <p style="font-size:0.8rem;color:#556677;margin-top:0.5rem;">약 10~20초 소요됩니다</p>
    </div>
  </div>

  <!-- Result -->
  <div id="result" class="card result">
    <h2>📈 진단 결과</h2>
    <div class="score-ring" id="scoreRing">0</div>
    <p style="text-align:center;" id="scoreLabel"></p>

    <div style="margin:1.5rem 0;">
      <h2>🔎 분석 요약</h2>
      <div id="summary"></div>
    </div>

    <div>
      <h2>💡 개선 제안</h2>
      <div id="recommendations"></div>
    </div>

    <div class="cta-box">
      <h3>🚀 이걸 직접 하고 계신가요?</h3>
      <p>AI가 콘텐츠를 만들고, 예약 발행까지 자동화합니다.<br>월 29만원으로 시작하는 SNS 자동화 시스템</p>
      <a href="#" class="btn-small" onclick="alert('문의: 카카오톡 채널 추가 또는 프로필 링크 참조')">자세히 알아보기</a>
    </div>
  </div>

  <footer>
    studio_sj · AI 기반 SNS 자동화 솔루션
  </footer>
</div>

<script>
let step = 1;

function nextStep() {
  const u = document.getElementById('username').value.trim();
  const ind = document.getElementById('industry').value;
  if (!u) { alert('계정명을 입력해주세요'); return; }
  if (!ind) { alert('업종을 선택해주세요'); return; }
  document.getElementById('step1').classList.add('hidden');
  document.getElementById('step2').classList.remove('hidden');
  step = 2;
  document.getElementById('s1').classList.remove('active');
  document.getElementById('s1').classList.add('done');
  document.getElementById('s2').classList.add('active');
}

function prevStep() {
  document.getElementById('step2').classList.add('hidden');
  document.getElementById('step1').classList.remove('hidden');
  step = 1;
  document.getElementById('s2').classList.remove('active');
  document.getElementById('s1').classList.add('active');
}

async function runDiagnosis() {
  const username = document.getElementById('username').value.trim();
  const industry = document.getElementById('industry').value;
  const followers = document.getElementById('followers').value;
  const posting = document.getElementById('posting').value;
  const painpoint = document.getElementById('painpoint').value;

  // Validate
  if (!painpoint) { alert('가장 어려운 점을 선택해주세요'); return; }

  // Show loading
  document.getElementById('step2').classList.add('hidden');
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('s2').classList.remove('active');
  document.getElementById('s2').classList.add('done');
  document.getElementById('s3').classList.add('active');

  try {
    // Generate diagnosis using prompt engineering (runs locally)
    setTimeout(() => {
      // Calculate score based on inputs
      const fScore = Math.min(5 - parseInt(followers), 5);
      const pScore = Math.min(parseInt(posting), 4);
      const rawScore = Math.round((fScore * 3 + pScore * 2 + (painpoint ? 2 : 1)) / 7 * 100);
      const score = Math.min(100, Math.max(20, rawScore));

      // Generate analysis
      const painPoints = {
        '콘텐츠 아이디어 부족': '콘텐츠 부족 = 꾸준함 부족 = 알고리즘 불이익',
        '시간 부족': '운영 시간 부족 = 불규칙한 발행 = 팔로워 이탈',
        '팔로워 증가 안 됨': '팔로워 정체 = 도달률 문제 or 콘텐츠 전략 부재',
        '좋아요/댓글 없음': '참여율 부족 = 콘텐츠가 타겟에 맞지 않거나 CTA 부재',
        '매출 연결 안 됨': 'SNS → 매출 전환 구조 미설계 = 단순 홍보성 포스팅',
        '디자인/영상 제작': '비주얼 퀄리티 = 신뢰도 = 방문 전환에 직접 영향',
        '해시태그 전략': '해시태그 = 유일한 무료 노출 채널. 전략 부재 = 기회 손실'
      };
      const painText = painPoints[painpoint] || '개선이 필요한 부분이 있습니다';

      const industryRecs = {
        '카페/디저트': ['메뉴 촬영은 자연광 + 각도 45도', '스토리로 오늘의 메뉴 매일 업로드', '리뷰/방문 인증 리포스트', '지역 해시태그 + 메뉴명 해시태그'],
        '음식점/맛집': ['비주얼이 가장 중요한 메뉴 3개 선정', '조리 과정 릴스 (15초 이하)', '네이버 플레이스와 인스타 연동', '단골 고객 리뷰 리그램'],
        '뷰티/헤어/네일': ['시술 전후 비교가 가장 강력한 콘텐츠', '트렌드 해시태그 + 지역 해시태그', '고객 후기 영상 확보', '시즌별 제안/이벤트 릴스'],
      };
      const commonRecs = [
        '처음 2초 강한 훅으로 시청자 멈추게 하기',
        '릴스 길이 7~15초로 유지 (완료율↑)',
        '저장/공유 유도 CTA 넣기 ("저장해두고 보세요")',
        '주 4~5회 꾸준한 발행 = 알고리즘 신호',
        '댓글 1시간 내 응답 = 초기 참여율↑',
        '릴스는 가로 9:16 세로 비율 유지',
      ];

      const recs = industryRecs[industry] || [];
      const allRecs = [...recs, ...commonRecs].slice(0, 6);

      // Grade
      let grade, gradeColor;
      if (score >= 70) { grade = '양호'; gradeColor = 'score-high'; }
      else if (score >= 40) { grade = '보통'; gradeColor = 'score-mid'; }
      else { grade = '개선 필요'; gradeColor = 'score-low'; }

      // Render
      document.getElementById('scoreRing').textContent = score;
      document.getElementById('scoreRing').className = `score-ring ${gradeColor}`;
      document.getElementById('scoreLabel').textContent = 
        `@${username} · ${industry} · 종합 점수: ${grade}`;

      // Summary tags
      const summaryEl = document.getElementById('summary');
      summaryEl.innerHTML = `
        <div style="margin-bottom:0.5rem;">
          <span class="tag ${parseInt(followers) < 3 ? 'tag-bad' : 'tag-good'}">
            팔로워: ${document.getElementById('followers').selectedOptions[0].text.split('~')[0]} 
          </span>
          <span class="tag ${parseInt(posting) < 2 ? 'tag-bad' : 'tag-good'}">
            발행: ${document.getElementById('posting').selectedOptions[0].text.split('(')[0]}
          </span>
        </div>
        <div class="rec-item">📌 핵심 문제: ${painText}</div>
      `;

      // Recommendations
      const recEl = document.getElementById('recommendations');
      recEl.innerHTML = allRecs.map((r, i) => 
        `<div class="rec-item"><strong>${i+1}.</strong> ${r}</div>`
      ).join('');

      // Show result
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('result').classList.add('visible');
      document.getElementById('s3').classList.remove('active');
      document.getElementById('s3').classList.add('done');

    }, 800); // Simulate AI processing
  } catch(e) {
    alert('분석 중 오류가 발생했습니다. 다시 시도해주세요.');
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('step2').classList.remove('hidden');
  }
}
</script>
</body>
</html>
