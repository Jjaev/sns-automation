# IG 상호작용 봇 — 매일 09:00 KST
# 타겟 업종별 상호작용 가이드 → Telegram 발송
# 직접 좋아요/댓글/팔로우는 사람이! (계정 보호)
name: engagement-bot

on:
  schedule:
    - cron: '0 0 * * *'  # 09:00 KST (UTC 00)
  workflow_dispatch:

jobs:
  suggest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate engagement queue
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/engagement-bot.js
