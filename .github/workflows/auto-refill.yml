name: Auto Refill Queue

on:
  schedule:
    - cron: '0 6 * * 0'  # 매주 일요일 15:00 KST (UTC+9)
  workflow_dispatch:       # 수동 실행 가능

jobs:
  refill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci --omit=dev

      - name: Check queue and refill if needed
        run: |
          # Queue 상태 확인
          COUNT=$(node scripts/check-queue.js)
          echo "Ready posts: $COUNT"

          if [ "$COUNT" -lt 15 ]; then
            echo "Queue low ($COUNT). Refilling..."
            node src/bulk-generate.mjs --count=30
            echo "Refill complete!"
          else
            echo "Queue healthy ($COUNT). No refill needed."
          fi
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
